<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Hashtags</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" type="module" defer ></script>
</head>
<body>
    <h2>Gerenciador de Hashtags Populares</h2>

    <div class="controles">
        <input type="text" id="input_hashtag" placeholder="Digite a hashtag (ex: #web)">
        <button id="botao_adicionar">Adicionar</button>
        <button id="botao_remover">Remover Selecionada</button>
        <div id="mensagem_erro"></div>
    </div>

    <select id="lista_hashtags" size="5"></select>
</body>
</html>
